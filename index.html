<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Script Library | 技術スクリプト集</title>
<style>
:root{font-family:system-ui,-apple-system,"Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;color:#e7edf7;background:#0b1220}*{box-sizing:border-box}body{margin:0}header{border-bottom:1px solid #26344c;background:#101b2c}.wrap{max-width:1080px;margin:auto;padding:0 22px}.top{padding:42px 0 35px}.eyebrow{color:#67d9c1;letter-spacing:.15em;font-size:12px;font-weight:bold}h1{font-size:clamp(30px,5vw,50px);margin:8px 0}header p{color:#a7b7cd;line-height:1.8;max-width:740px}.controls{display:flex;gap:12px;flex-wrap:wrap;padding:25px 0 18px}input{flex:1;min-width:210px;border-radius:10px;border:1px solid #38506a;padding:13px 15px;background:#132238;color:#fff;font:inherit}input:focus{outline:2px solid #67d9c1}.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:22px}button{cursor:pointer;font:inherit} .chip{border:1px solid #3a5068;color:#c8d8ea;border-radius:40px;background:transparent;padding:8px 14px}.chip.active{background:#67d9c1;border-color:#67d9c1;color:#0a2030;font-weight:700}#count{color:#9aacc2;margin:10px 0 18px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,440px),1fr));gap:18px;padding-bottom:80px}.card{border:1px solid #2a3d55;border-radius:16px;padding:22px;background:#142137;min-width:0}.card h2{font-size:19px;margin:13px 0 9px}.desc{color:#b1c1d7;line-height:1.7;font-size:14px}.tag{font-size:12px;border:1px solid #38516e;border-radius:30px;padding:4px 10px;color:#7ce7d1}.note{color:#f7cc89;font-size:13px;line-height:1.6}pre{background:#07101e;border-radius:9px;overflow:auto;padding:15px;color:#d9e6f4;font-size:12.5px;line-height:1.7}code{font-family:ui-monospace,SFMono-Regular,Consolas,monospace}.copy{background:#213c58;border:1px solid #476384;border-radius:8px;color:#fff;padding:9px 14px}.copy:hover{background:#2c526d}.bottom{display:flex;justify-content:space-between;align-items:center;gap:12px}footer{color:#7289a4;font-size:12px;text-align:center;padding:25px;border-top:1px solid #26344c}#empty{color:#b1c1d7;padding:20px 0;display:none}
/* 大きなスクリプトは必要なときだけ表示。コード欄内だけスクロールできます。 */
.code-area{max-height:460px;overflow:auto;white-space:pre;}
.code-toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:14px;}
.download{display:inline-block;text-decoration:none;background:#1c4352;border:1px solid #397887;border-radius:8px;color:#e7edf7;padding:9px 14px;}
.download:hover{background:#24586a;}
.copy:disabled{cursor:wait;opacity:.6;}
.status{color:#a7b7cd;font-size:12px;line-height:1.6;min-height:1.2em;margin:7px 0;}
.status.error{color:#f7cc89;}
[hidden]{display:none !important;}
</style>
</head>
<body>
<header><div class="wrap top"><div class="eyebrow">CODE / AUTOMATION / NOTES</div><h1>Script Library<span style="color:#67d9c1">.</span></h1><p>PowerShell、Python、Cisco、Tera Termなどの便利なスクリプトや技術メモをまとめています。必要なコードを探してコピーできます。</p></div></header>
<main class="wrap"><div class="controls"><input id="search" type="search" placeholder="スクリプト名・内容を検索…" aria-label="スクリプトを検索"></div><div class="chips" id="filters"></div><div id="count"></div><div id="empty">該当するスクリプトがありません。</div><div class="grid" id="cards"></div></main>
<footer>Script Library · GitHub Pages</footer>
<script>
// ===== ここに公開したいスクリプトを追加してください =====
const scripts = [
  {
    title: 'CSVファイルの一覧を表示',
    category: 'PowerShell',
    description: 'カレントフォルダ内のCSVファイル名を一覧表示する、読み取り専用の例です。',
    note: '表示のみでファイルは変更しません。',
    code: 'Get-ChildItem -Path . -Filter "*.csv" -File | Select-Object Name'
  },
  {
    title: 'フォルダ内のTXTを列挙',
    category: 'Python',
    description: 'Python標準ライブラリで現在のフォルダにあるTXTファイル名を表示します。',
    note: 'Python 3.x用のサンプルです。',
    code: 'from pathlib import Path\n\nfor path in Path(".").glob("*.txt"):\n    print(path.name)'
  },
  {
    title: 'IPインターフェース状態の確認',
    category: 'Cisco',
    description: 'Cisco IOS XEのインターフェースのIPアドレスと稼働状態を確認します。',
    note: '装置のソフトウェアや権限によって実行可否が異なります。',
    code: 'show ip interface brief'
  },
  {
    title: 'Tera Term接続先のホスト名取得',
    category: 'Tera Term',
    description: 'Tera Termマクロで接続先のホスト名を変数へ取得する例です。',
    note: '接続状態とTera Termのバージョンを確認してください。',
    code: 'gethostname host_name\nmessagebox host_name "接続先"'
  },
  {
    title: 'Tera Termマクロ（全文）',
    category: 'Tera Term',
    description: '約20,000行のTera Termマクロ。表示、全文コピー',
    note: '実行前に接続先や処理内容を確認してください。',
    file: 'getconfig_start.txt'
  },
  {
    title: 'Tera Termマクロ test2',
    category: 'Tera Term',
    description: '約20,000行のTera Termマクロ。表示、全文コピー',
    note: '実行前に接続先や処理内容を確認してください。',
    file: 'getconfig_guips1.txt'
  },
  {
    title: 'Tera Termマクロ test3',
    category: 'Tera Term',
    description: '約20,000行のTera Termマクロ。表示、全文コピー、TTLファイルのダウンロードができます。',
    note: '実行前に接続先や処理内容を確認してください。',
    file: 'getconfig_child.txt'
  },
];
// ===== 編集エリアはここまで =====
const search = document.getElementById('search');
const filters = document.getElementById('filters');
const cards = document.getElementById('cards');
let active = 'すべて';
const categories = ['すべて', ...new Set(scripts.map(x => x.category))];
function el(tag, className, text){const node=document.createElement(tag);if(className)node.className=className;if(text!==undefined)node.textContent=text;return node;}
function renderFilters(){filters.replaceChildren();for(const cat of categories){const b=el('button','chip'+(cat===active?' active':''),cat);b.type='button';b.addEventListener('click',()=>{active=cat;renderFilters();renderCards();});filters.append(b);}}
// 外部のTTLファイルはクリックされるまで読み込みません。
const externalCache = new Map();
async function getCode(s) {
  if (typeof s.code === 'string') return s.code;
  if (externalCache.has(s.file)) return externalCache.get(s.file);
  const response = await fetch(s.file, { cache: 'no-store' });
  if (!response.ok) throw new Error(`HTTP ${response.status}`);
  const content = await response.text();
  externalCache.set(s.file, content);
  return content;
}
function splitCodeLines(text) {
  const lines = text.split(/\r\n|\r|\n/);
  if (lines.length > 1 && lines[lines.length - 1] === '') lines.pop();
  return lines;
}
function renderCards() {
  const q = search.value.toLocaleLowerCase().trim();
  // 外部ファイルは未読み込みなので、タイトル・説明・注意事項で検索します。
  const found = scripts.filter(s =>
    (active === 'すべて' || s.category === active) &&
    [s.title, s.category, s.description, s.note, s.code ?? '']
      .join(' ').toLocaleLowerCase().includes(q)
  );
  cards.replaceChildren();
  document.getElementById('count').textContent = `${found.length} 件のスクリプト`;
  document.getElementById('empty').style.display = found.length ? 'none' : 'block';

  for (const s of found) {
    const card = el('article', 'card');
    card.append(el('span', 'tag', s.category), el('h2', '', s.title),
      el('p', 'desc', s.description));

    if (!s.file) {
      // 既存の短いサンプルの表示は変更しません。
      const pre = el('pre');
      pre.append(el('code', '', s.code));
      card.append(pre);
      const bottom = el('div', 'bottom');
      bottom.append(el('span', 'note', s.note));
      const copy = el('button', 'copy', 'コピー');
      copy.type = 'button';
      copy.addEventListener('click', async () => {
        try {
          await navigator.clipboard.writeText(s.code);
          copy.textContent = 'コピーしました';
          setTimeout(() => copy.textContent = 'コピー', 1800);
        } catch {
          copy.textContent = 'コピーできません';
        }
      });
      bottom.append(copy); card.append(bottom); cards.append(card);
      continue;
    }

    const status = el('p', 'status', '20,000行でも、必要なときだけ読み込みます。');
    const pre = el('pre', 'code-area');
    pre.hidden = true;
    const code = el('code');
    pre.append(code);
    const toolbar = el('div', 'code-toolbar');
    const show = el('button', 'copy', '先頭200行を表示');
    const full = el('button', 'copy', '全文を表示');
    full.hidden = true;
    const copy = el('button', 'copy', '全文コピー');
    const download = el('a', 'download', 'TTLをダウンロード');
    download.href = s.file;
    download.setAttribute('download', s.file.split('/').pop());

    let visible = false;
    let showingAll = false;
    let loadedText = null;
    const get = async button => {
      button.disabled = true;
      status.className = 'status';
      status.textContent = '読み込み中…';
      try {
        const text = await getCode(s);
        loadedText = text;
        status.textContent = `${splitCodeLines(text).length.toLocaleString()} 行のコードを読み込みました。`;
        return text;
      } catch (error) {
        status.className = 'status error';
        status.textContent = `読み込めません（${error.message}）。GitHubのindex.htmlと同じ場所に「${s.file}」をアップロードしてください。`;
        return null;
      } finally {
        button.disabled = false;
      }
    };
    show.addEventListener('click', async () => {
      if (visible) {
        visible = false;
        pre.hidden = true;
        full.hidden = true;
        show.textContent = '先頭200行を表示';
        return;
      }
      const text = loadedText ?? await get(show);
      if (text === null) return;
      const lines = splitCodeLines(text);
      code.textContent = showingAll ? text : lines.slice(0, 200).join('\n');
      visible = true;
      pre.hidden = false;
      show.textContent = 'コードを閉じる';
      full.hidden = lines.length <= 200;
      full.textContent = showingAll ? '先頭200行に戻す' : '全文を表示';
    });
    full.addEventListener('click', () => {
      if (loadedText === null) return;
      showingAll = !showingAll;
      code.textContent = showingAll ? loadedText : splitCodeLines(loadedText).slice(0, 200).join('\n');
      full.textContent = showingAll ? '先頭200行に戻す' : '全文を表示';
    });
    copy.addEventListener('click', async () => {
      const text = loadedText ?? await get(copy);
      if (text === null) return;
      try {
        await navigator.clipboard.writeText(text);
        copy.textContent = 'コピーしました';
        setTimeout(() => copy.textContent = '全文コピー', 1800);
      } catch {
        status.className = 'status error';
        status.textContent = 'コピーできませんでした。HTTPSの公開サイトで再度お試しください。';
      }
    });
    toolbar.append(show, full, copy);
    card.append(toolbar, status, pre, el('p', 'note', s.note));
    cards.append(card);
  }
}
search.addEventListener('input',renderCards);renderFilters();renderCards();
</script>
</body></html>
